<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โรงแรมแฮปปี้ไนท์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: url('https://github.com/wairueangsiriphong092-beep/new-Hotel-Project/blob/main/Gemini_Generated_Image_flnb93flnb93flnb.png?raw=true') no-repeat center center fixed;
            background-size: cover;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .item-card {
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid #e5e7eb;
        }
        .item-card:hover { border-color: #3b82f6; }
        .item-check:checked + .item-card {
            background-color: #eff6ff;
            border-color: #3b82f6;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2);
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }
    </style>


    <!-- Dashboard visual enhancement: added without changing existing logic -->
    <style>
        /* Dashboard shell */
        #dashboardView {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at top right, rgba(59,130,246,.16), transparent 34%),
                radial-gradient(circle at bottom left, rgba(14,165,233,.12), transparent 32%),
                rgba(255,255,255,.96);
            border: 1px solid rgba(255,255,255,.75);
            box-shadow: 0 28px 70px rgba(15,23,42,.22), 0 8px 24px rgba(59,130,246,.10);
        }

        #dashboardView::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 5px;
            background: linear-gradient(90deg, #2563eb, #06b6d4, #22c55e);
        }

        #dashboardView > div:first-child {
            padding: 8px 4px 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        #dashboardView h2 {
            font-size: clamp(1.65rem, 3vw, 2.25rem);
            letter-spacing: -.025em;
            background: linear-gradient(90deg, #0f172a, #2563eb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #lastUpdated {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            margin-top: .45rem;
        }

        #lastUpdated::before {
            content: '';
            width: .55rem;
            height: .55rem;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 0 5px rgba(34,197,94,.12);
        }

        #refreshButton {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding-inline: 1.15rem;
            border: 1px solid #bfdbfe;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            color: #1d4ed8;
            box-shadow: 0 8px 20px rgba(37,99,235,.12);
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        #refreshButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(37,99,235,.18);
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
        }

        /* Summary cards */
        #dashboardView .grid.grid-cols-1.sm\:grid-cols-3 > div {
            position: relative;
            overflow: hidden;
            padding: 1.25rem;
            border: 1px solid rgba(255,255,255,.9);
            box-shadow: 0 14px 32px rgba(15,23,42,.09);
            transition: transform .22s ease, box-shadow .22s ease;
        }

        #dashboardView .grid.grid-cols-1.sm\:grid-cols-3 > div:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 38px rgba(15,23,42,.14);
        }

        #dashboardView .grid.grid-cols-1.sm\:grid-cols-3 > div::after {
            content: '';
            position: absolute;
            right: -20px;
            top: -20px;
            width: 90px;
            height: 90px;
            border-radius: 999px;
            background: currentColor;
            opacity: .08;
        }

        #dashboardView .grid.grid-cols-1.sm\:grid-cols-3 > div:nth-child(1) {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border-color: #bfdbfe;
        }

        #dashboardView .grid.grid-cols-1.sm\:grid-cols-3 > div:nth-child(2) {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border-color: #bbf7d0;
        }

        #dashboardView .grid.grid-cols-1.sm\:grid-cols-3 > div:nth-child(3) {
            background: linear-gradient(135deg, #fff1f2, #fee2e2);
            border-color: #fecaca;
        }

        #totalCount, #successCount, #problemCount {
            margin-top: .35rem;
            line-height: 1;
            letter-spacing: -.04em;
        }

        /* Filter controls */
        #searchInput, #filterDate, #filterStatus {
            min-height: 54px;
            border-color: #dbe4f0;
            background-color: rgba(255,255,255,.92);
            box-shadow: 0 6px 18px rgba(15,23,42,.06);
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }

        #searchInput:focus, #filterDate:focus, #filterStatus:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(59,130,246,.12), 0 8px 22px rgba(15,23,42,.08);
            transform: translateY(-1px);
        }

        /* Table */
        #dashboardView .overflow-x-auto {
            border: 1px solid #e2e8f0;
            border-radius: 1.25rem;
            background: rgba(255,255,255,.94);
            box-shadow: 0 16px 36px rgba(15,23,42,.08);
        }

        #dashboardView table {
            overflow: hidden;
        }

        #dashboardView thead {
            background: linear-gradient(90deg, #0f172a, #1e3a8a);
            color: white;
        }

        #dashboardView thead tr {
            border-bottom: 0;
        }

        #dashboardView th {
            padding-top: 1rem;
            padding-bottom: 1rem;
            font-weight: 600;
            letter-spacing: .01em;
            white-space: nowrap;
        }

        #dashboardTableBody tr {
            transition: background-color .18s ease, transform .18s ease;
        }

        #dashboardTableBody tr:nth-child(even) {
            background: #f8fafc;
        }

        #dashboardTableBody tr:hover {
            background: #eff6ff;
        }

        #dashboardTableBody td {
            border-bottom: 1px solid #eef2f7;
            vertical-align: middle;
        }

        #dashboardTableBody tr:last-child td {
            border-bottom: 0;
        }

        #dashboardMessage {
            border: 1px solid currentColor;
            box-shadow: 0 8px 22px rgba(15,23,42,.06);
        }

        #dashboardView > button:last-child {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .7rem 1rem;
            border-radius: .85rem;
            text-decoration: none;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: all .2s ease;
        }

        #dashboardView > button:last-child:hover {
            background: #eef2ff;
            color: #1d4ed8;
            border-color: #c7d2fe;
            transform: translateX(-2px);
        }

        @media (max-width: 640px) {
            #dashboardView {
                padding: 1rem;
                border-radius: 1.5rem;
            }

            #dashboardView .grid.grid-cols-1.sm\:grid-cols-3 > div {
                padding: 1rem;
            }

            #dashboardView th, #dashboardView td {
                padding: .85rem;
            }
        }
    </style>



    <!-- Login and form visual enhancement: styles only, original data and logic unchanged -->
    <style>
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(15,23,42,.45), rgba(30,64,175,.18) 42%, rgba(14,165,233,.12)),
                radial-gradient(circle at 15% 15%, rgba(255,255,255,.22), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(59,130,246,.18), transparent 30%);
            z-index: -1;
        }

        #loginView,
        #appView {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.75);
            background:
                radial-gradient(circle at top right, rgba(59,130,246,.15), transparent 32%),
                radial-gradient(circle at bottom left, rgba(14,165,233,.10), transparent 30%),
                rgba(255,255,255,.96);
            box-shadow: 0 28px 75px rgba(15,23,42,.28), 0 10px 30px rgba(37,99,235,.12);
        }

        #loginView::before,
        #appView::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 6px;
            background: linear-gradient(90deg, #1d4ed8, #0ea5e9, #14b8a6);
        }

        #loginView::after {
            content: '';
            display: block;
            width: max-content;
            margin: -1rem auto 1.5rem;
            padding: .4rem .85rem;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .14em;
            color: #1d4ed8;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        #loginView h1 {
            margin-bottom: 2rem;
            padding-top: .55rem;
            font-size: clamp(1.75rem, 5vw, 2.3rem);
            letter-spacing: -.03em;
            background: linear-gradient(90deg, #0f172a, #1d4ed8, #0891b2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #loginView h1::before {
            content: '🏨';
            display: block;
            width: 76px;
            height: 76px;
            margin: 0 auto 1rem;
            border-radius: 24px;
            font-size: 2.1rem;
            line-height: 76px;
            background: linear-gradient(145deg, #dbeafe, #eff6ff);
            border: 1px solid #bfdbfe;
            box-shadow: 0 14px 28px rgba(37,99,235,.16);
        }

        #username,
        #password {
            min-height: 58px;
            border: 1px solid #dbe4f0;
            background: rgba(255,255,255,.96);
            box-shadow: 0 7px 20px rgba(15,23,42,.06);
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }

        #username:hover,
        #password:hover {
            border-color: #93c5fd;
        }

        #username:focus,
        #password:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,.13), 0 10px 26px rgba(15,23,42,.08);
            transform: translateY(-1px);
        }

        #loginButton,
        #saveButton {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.28);
            background: linear-gradient(135deg, #1d4ed8, #2563eb 48%, #0891b2);
            box-shadow: 0 14px 30px rgba(37,99,235,.28);
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }

        #loginButton:hover:not(:disabled),
        #saveButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 18px 38px rgba(37,99,235,.36);
            filter: saturate(1.08);
        }

        #loginButton::after,
        #saveButton::after {
            content: '';
            position: absolute;
            top: -120%;
            left: -30%;
            width: 35%;
            height: 340%;
            transform: rotate(28deg);
            background: rgba(255,255,255,.22);
            transition: left .55s ease;
        }

        #loginButton:hover::after,
        #saveButton:hover::after {
            left: 115%;
        }

        #loginError {
            padding: .85rem 1rem;
            border-radius: 1rem;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            box-shadow: 0 8px 20px rgba(225,29,72,.08);
        }

        #appView > div:first-child {
            padding: .35rem .2rem 1.25rem;
            border-bottom: 1px solid #e5e7eb;
        }

        #appView h2 {
            font-size: clamp(1.55rem, 4vw, 2.05rem);
            letter-spacing: -.025em;
            background: linear-gradient(90deg, #0f172a, #1d4ed8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #currentUserLabel {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            margin-top: .55rem;
            padding: .35rem .7rem;
            border-radius: 999px;
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
            font-weight: 500;
        }

        #currentUserLabel::before {
            content: '';
            width: .5rem;
            height: .5rem;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 0 4px rgba(34,197,94,.12);
        }

        #appView > div:first-child button {
            padding: .65rem 1rem;
            border-radius: .9rem;
            text-decoration: none;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border: 1px solid #bfdbfe;
            box-shadow: 0 8px 20px rgba(37,99,235,.10);
        }

        #appView > div:first-child button:hover {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            transform: translateY(-1px);
        }

        #appView > .space-y-6 > div {
            padding: 1.15rem;
            border-radius: 1.25rem;
            background: rgba(248,250,252,.8);
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 22px rgba(15,23,42,.045);
        }

        #appView label.block {
            display: flex;
            align-items: center;
            gap: .55rem;
            margin-bottom: .85rem;
            color: #1e293b;
        }

        #appView label.block::before {
            content: '';
            width: .55rem;
            height: 1.3rem;
            border-radius: 999px;
            background: linear-gradient(#2563eb, #06b6d4);
        }

        #locationSelect,
        #statusSelect,
        #reasonInput {
            min-height: 56px;
            border-color: #dbe4f0;
            box-shadow: 0 6px 18px rgba(15,23,42,.055);
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }

        #locationSelect:focus,
        #statusSelect:focus,
        #reasonInput:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(59,130,246,.12), 0 9px 22px rgba(15,23,42,.07);
            transform: translateY(-1px);
        }

        .item-card {
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-color: #dbe4f0;
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            box-shadow: 0 7px 18px rgba(15,23,42,.06);
        }

        .item-card:hover {
            transform: translateY(-2px);
            border-color: #60a5fa;
            box-shadow: 0 12px 24px rgba(37,99,235,.12);
        }

        .item-check:checked + .item-card {
            color: #1d4ed8;
            background: linear-gradient(145deg, #eff6ff, #dbeafe);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.10), 0 12px 26px rgba(37,99,235,.16);
        }

        #itemChecklist > label:last-child {
            background: linear-gradient(135deg, #f8fafc, #eff6ff);
            border-color: #93c5fd;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        #itemChecklist > label:last-child:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            box-shadow: 0 10px 24px rgba(37,99,235,.10);
        }

        #checkAll {
            accent-color: #2563eb;
        }

        #reasonContainer {
            padding-top: .25rem;
        }

        #saveStatus {
            border: 1px solid currentColor;
            box-shadow: 0 9px 24px rgba(15,23,42,.07);
        }

        @media (max-width: 640px) {
            #loginView,
            #appView {
                border-radius: 1.55rem;
            }

            #loginView {
                padding: 1.4rem;
            }

            #appView {
                padding: 1rem;
            }

            #appView > div:first-child {
                align-items: flex-start;
                gap: .75rem;
            }

            #appView > div:first-child button {
                white-space: nowrap;
                font-size: .88rem;
            }

            #appView > .space-y-6 > div {
                padding: .95rem;
            }
        }
    </style>

</head>
<body class="min-h-screen p-4 md:p-8">

    <div id="loginView" class="max-w-md mx-auto glass p-8 rounded-3xl shadow-2xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">โรงแรมแฮปปี้ไนท์</h1>
        <div class="space-y-4">
            <input type="text" id="username" autocomplete="username" placeholder="Username" class="w-full p-4 border rounded-2xl bg-white shadow-inner focus:ring-2 focus:ring-blue-400 outline-none">
            <input type="password" id="password" autocomplete="current-password" placeholder="Password" class="w-full p-4 border rounded-2xl bg-white shadow-inner focus:ring-2 focus:ring-blue-400 outline-none">
            <button id="loginButton" onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 shadow-lg transition transform active:scale-95">เข้าสู่ระบบ</button>
        </div>
        <p id="loginError" class="text-red-500 text-center mt-4 hidden font-medium"></p>
    </div>

    <div id="appView" class="max-w-2xl mx-auto glass p-6 md:p-8 rounded-3xl shadow-2xl hidden">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">บันทึกข้อมูล</h2>
                <p id="currentUserLabel" class="text-sm text-gray-500 mt-1"></p>
            </div>
            <button onclick="toggleDashboard()" class="text-blue-600 font-semibold hover:underline transition">ดู Dashboard</button>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-lg font-semibold mb-3 text-gray-700">สถานที่</label>
                <select id="locationSelect" class="w-full p-4 border-2 border-gray-200 rounded-2xl bg-white focus:ring-4 focus:ring-blue-100 outline-none"></select>
            </div>

            <div>
                <label class="block text-lg font-semibold mb-4 text-gray-700">รายการที่ตรวจ</label>
                <div class="grid grid-cols-2 gap-3" id="itemChecklist">
                    <label class="relative">
                        <input type="checkbox" value="เตียง" class="item-check hidden">
                        <div class="item-card p-4 rounded-2xl text-center font-medium bg-white">เตียง</div>
                    </label>
                    <label class="relative">
                        <input type="checkbox" value="ห้องน้ำ" class="item-check hidden">
                        <div class="item-card p-4 rounded-2xl text-center font-medium bg-white">ห้องน้ำ</div>
                    </label>
                    <label class="relative">
                        <input type="checkbox" value="แอร์" class="item-check hidden">
                        <div class="item-card p-4 rounded-2xl text-center font-medium bg-white">แอร์</div>
                    </label>
                    <label class="relative">
                        <input type="checkbox" value="ฝักบัว" class="item-check hidden">
                        <div class="item-card p-4 rounded-2xl text-center font-medium bg-white">ฝักบัว</div>
                    </label>
                    <label class="col-span-2 mt-2 flex items-center justify-center space-x-3 p-4 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-300 cursor-pointer hover:bg-gray-100">
                        <input type="checkbox" id="checkAll" onclick="toggleAll()" class="w-5 h-5">
                        <span class="font-bold text-blue-700">ตรวจสอบแล้วทั้งหมด</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-lg font-semibold mb-3 text-gray-700">สถานะ</label>
                <select id="statusSelect" onchange="toggleReason()" class="w-full p-4 border-2 border-gray-200 rounded-2xl bg-white focus:ring-4 focus:ring-blue-100 outline-none">
                    <option value="เรียบร้อย">เรียบร้อย ✅</option>
                    <option value="ไม่เรียบร้อย">ไม่เรียบร้อย ⚠️</option>
                </select>
                <div id="reasonContainer" class="hidden mt-3 animate-in fade-in duration-300">
                    <input type="text" id="reasonInput" maxlength="500" placeholder="ระบุสาเหตุที่ไม่เรียบร้อย..." class="w-full p-4 border-2 border-red-200 rounded-2xl bg-white focus:ring-4 focus:ring-red-100 outline-none">
                </div>
            </div>

            <button id="saveButton" onclick="submitRecord()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold text-lg hover:bg-blue-700 shadow-xl transition transform active:scale-95">บันทึกข้อมูล</button>
            <div id="saveStatus" class="hidden text-center font-bold p-4 rounded-2xl"></div>
        </div>
    </div>

    <div id="dashboardView" class="max-w-6xl mx-auto glass p-6 md:p-8 rounded-3xl shadow-2xl hidden mt-8">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-6">
            <div>
                <h2 class="text-2xl font-bold">Dashboard</h2>
                <p id="lastUpdated" class="text-sm text-gray-500 mt-1">ยังไม่ได้โหลดข้อมูล</p>
            </div>
            <button id="refreshButton" onclick="loadDashboardData(true)" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-xl font-semibold hover:bg-blue-100">รีเฟรชข้อมูล</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-blue-50 p-4 rounded-2xl">
                <p class="text-sm text-blue-600">รายการทั้งหมด</p>
                <p id="totalCount" class="text-3xl font-bold text-blue-800">0</p>
            </div>
            <div class="bg-green-50 p-4 rounded-2xl">
                <p class="text-sm text-green-600">เรียบร้อย</p>
                <p id="successCount" class="text-3xl font-bold text-green-800">0</p>
            </div>
            <div class="bg-red-50 p-4 rounded-2xl">
                <p class="text-sm text-red-600">ไม่เรียบร้อย</p>
                <p id="problemCount" class="text-3xl font-bold text-red-800">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="searchInput" oninput="renderDashboard()" placeholder="ค้นหาสถานที่..." class="p-4 border-2 rounded-2xl">
            <input type="date" id="filterDate" onchange="renderDashboard()" class="p-4 border-2 rounded-2xl">
            <select id="filterStatus" onchange="renderDashboard()" class="p-4 border-2 rounded-2xl">
                <option value="ทั้งหมด">สถานะทั้งหมด</option>
                <option value="เรียบร้อย">เรียบร้อย</option>
                <option value="ไม่เรียบร้อย">ไม่เรียบร้อย</option>
            </select>
        </div>

        <div id="dashboardMessage" class="hidden text-center p-4 mb-4 rounded-2xl"></div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[800px]">
                <thead>
                    <tr class="border-b-2 border-gray-200">
                        <th class="p-4">วันที่</th>
                        <th class="p-4">เวลา</th>
                        <th class="p-4">สถานที่</th>
                        <th class="p-4">รายการ</th>
                        <th class="p-4">สถานะ</th>
                        <th class="p-4">ผู้ตรวจ</th>
                    </tr>
                </thead>
                <tbody id="dashboardTableBody"></tbody>
            </table>
        </div>
        <button onclick="toggleDashboard()" class="mt-8 text-gray-500 font-medium hover:text-gray-800 underline">ย้อนกลับ</button>
    </div>

    <script>
        // ใส่ URL ที่ได้จาก Deploy > New deployment > Web app และต้องลงท้ายด้วย /exec
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxSvJ0Oq5CkykZXoOL9X508aOUCtA1dwYv3IXeqOhkLwupP2UNqJNPwp2ti5zjvHSa5Ng/exec';

        // Dashboard จะดึงข้อมูลใหม่ทุก 5 วินาทีขณะเปิดอยู่ (near real-time)
        const DASHBOARD_REFRESH_MS = 5000;

        let currentAdmin = '';
        let currentPassword = '';
        let logs = [];
        let dashboardTimer = null;
        let dashboardLoading = false;

        document.getElementById('password').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') login();
        });

        function isApiConfigured() {
            return GAS_WEB_APP_URL.startsWith('https://script.google.com/macros/s/') && GAS_WEB_APP_URL.endsWith('/exec');
        }

        async function callApi(action, payload = {}) {
            if (!isApiConfigured()) {
                throw new Error('กรุณาใส่ Google Apps Script Web App URL ในตัวแปร GAS_WEB_APP_URL ก่อนใช้งาน');
            }

            const formData = new URLSearchParams({
                action,
                username: currentAdmin,
                password: currentPassword,
                ...payload
            });

            const response = await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                },
                body: formData.toString(),
                redirect: 'follow',
                cache: 'no-store'
            });

            if (!response.ok) {
                throw new Error(`เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ (HTTP ${response.status})`);
            }

            const text = await response.text();
            let result;
            try {
                result = JSON.parse(text);
            } catch (error) {
                throw new Error('รูปแบบข้อมูลที่ได้รับจาก Apps Script ไม่ถูกต้อง กรุณาตรวจสอบ URL และสิทธิ์การ Deploy');
            }

            if (!result.success) {
                throw new Error(result.message || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์');
            }

            return result;
        }

        async function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const loginButton = document.getElementById('loginButton');
            const loginError = document.getElementById('loginError');

            loginError.classList.add('hidden');

            if (!user || !pass) {
                showLoginError('กรุณากรอก Username และ Password');
                return;
            }

            currentAdmin = user;
            currentPassword = pass;
            setButtonLoading(loginButton, true, 'กำลังเข้าสู่ระบบ...');

            try {
                await callApi('login');
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('appView').classList.remove('hidden');
                document.getElementById('currentUserLabel').textContent = `ผู้ใช้งาน: ${currentAdmin}`;
                initForm();
            } catch (error) {
                currentAdmin = '';
                currentPassword = '';
                showLoginError(error.message);
            } finally {
                setButtonLoading(loginButton, false, 'เข้าสู่ระบบ');
            }
        }

        function showLoginError(message) {
            const loginError = document.getElementById('loginError');
            loginError.textContent = message;
            loginError.classList.remove('hidden');
        }

        function initForm() {
            const select = document.getElementById('locationSelect');
            select.innerHTML = '<option value="">เลือกห้อง/บ้าน</option>';
            for (let i = 1; i <= 24; i++) select.insertAdjacentHTML('beforeend', `<option value="ห้อง ${i}">ห้อง ${i}</option>`);
            for (let i = 1; i <= 3; i++) select.insertAdjacentHTML('beforeend', `<option value="บ้าน ${i}">บ้าน ${i}</option>`);
        }

        function toggleAll() {
            const checked = document.getElementById('checkAll').checked;
            document.querySelectorAll('.item-check').forEach((item) => {
                item.checked = checked;
            });
        }

        function toggleReason() {
            const status = document.getElementById('statusSelect').value;
            const reasonContainer = document.getElementById('reasonContainer');
            reasonContainer.classList.toggle('hidden', status !== 'ไม่เรียบร้อย');
            if (status === 'เรียบร้อย') document.getElementById('reasonInput').value = '';
        }

        async function submitRecord() {
            const location = document.getElementById('locationSelect').value;
            const status = document.getElementById('statusSelect').value;
            const reason = document.getElementById('reasonInput').value.trim();
            const selectedItems = Array.from(document.querySelectorAll('.item-check:checked')).map((item) => item.value);
            const isAllChecked = document.getElementById('checkAll').checked;
            const saveButton = document.getElementById('saveButton');

            if (!location) return alert('โปรดเลือกสถานที่');
            if (selectedItems.length === 0 && !isAllChecked) return alert('โปรดเลือกจุดที่ตรวจ');
            if (status === 'ไม่เรียบร้อย' && !reason) return alert('โปรดระบุสาเหตุที่ไม่เรียบร้อย');

            const record = {
                location,
                items: isAllChecked ? 'ทั้งหมด' : selectedItems.join(', '),
                status,
                reason
            };

            setButtonLoading(saveButton, true, 'กำลังบันทึก...');
            hideSaveStatus();

            try {
                const result = await callApi('saveRecord', {
                    record: JSON.stringify(record)
                });
                showSaveStatus(result.message || 'บันทึกข้อมูลลง Google Sheet แล้ว ✅', true);
                resetForm();

                // เพิ่มข้อมูลใหม่ทันที และโหลดจาก Sheet ซ้ำเพื่อยืนยันข้อมูลจริง
                if (result.record) {
                    logs.unshift(result.record);
                    renderDashboard();
                }
                await loadDashboardData(false);
            } catch (error) {
                showSaveStatus(error.message, false);
            } finally {
                setButtonLoading(saveButton, false, 'บันทึกข้อมูล');
            }
        }

        function resetForm() {
            document.getElementById('locationSelect').value = '';
            document.querySelectorAll('.item-check').forEach((item) => {
                item.checked = false;
            });
            document.getElementById('checkAll').checked = false;
            document.getElementById('statusSelect').value = 'เรียบร้อย';
            document.getElementById('reasonInput').value = '';
            toggleReason();
        }

        function showSaveStatus(message, success) {
            const statusDiv = document.getElementById('saveStatus');
            statusDiv.textContent = message;
            statusDiv.className = `text-center font-bold p-4 rounded-2xl ${success ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`;
            statusDiv.classList.remove('hidden');
            if (success) setTimeout(hideSaveStatus, 3000);
        }

        function hideSaveStatus() {
            document.getElementById('saveStatus').classList.add('hidden');
        }

        async function toggleDashboard() {
            const appView = document.getElementById('appView');
            const dashboardView = document.getElementById('dashboardView');
            const openingDashboard = dashboardView.classList.contains('hidden');

            appView.classList.toggle('hidden');
            dashboardView.classList.toggle('hidden');

            if (openingDashboard) {
                await loadDashboardData(true);
                startDashboardPolling();
            } else {
                stopDashboardPolling();
            }
        }

        function startDashboardPolling() {
            stopDashboardPolling();
            dashboardTimer = setInterval(() => {
                if (!document.hidden) loadDashboardData(false);
            }, DASHBOARD_REFRESH_MS);
        }

        function stopDashboardPolling() {
            if (dashboardTimer) {
                clearInterval(dashboardTimer);
                dashboardTimer = null;
            }
        }

        async function loadDashboardData(showLoading = true) {
            if (dashboardLoading || !currentAdmin) return;
            dashboardLoading = true;

            const refreshButton = document.getElementById('refreshButton');
            if (showLoading) {
                setButtonLoading(refreshButton, true, 'กำลังโหลด...');
                showDashboardMessage('กำลังดึงข้อมูลจาก Google Sheet...', true);
            }

            try {
                const result = await callApi('getRecords');
                logs = Array.isArray(result.records) ? result.records : [];
                renderDashboard();
                document.getElementById('lastUpdated').textContent = `อัปเดตล่าสุด ${new Date().toLocaleString('th-TH')}`;
                hideDashboardMessage();
            } catch (error) {
                showDashboardMessage(error.message, false);
            } finally {
                dashboardLoading = false;
                if (showLoading) setButtonLoading(refreshButton, false, 'รีเฟรชข้อมูล');
            }
        }

        function renderDashboard() {
            const tbody = document.getElementById('dashboardTableBody');
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const date = document.getElementById('filterDate').value;
            const status = document.getElementById('filterStatus').value;

            const filteredLogs = logs.filter((record) =>
                String(record.location || '').toLowerCase().includes(search) &&
                (date === '' || record.date === date) &&
                (status === 'ทั้งหมด' || record.status === status)
            );

            document.getElementById('totalCount').textContent = logs.length;
            document.getElementById('successCount').textContent = logs.filter((record) => record.status === 'เรียบร้อย').length;
            document.getElementById('problemCount').textContent = logs.filter((record) => record.status === 'ไม่เรียบร้อย').length;

            if (filteredLogs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500">ไม่พบข้อมูล</td></tr>';
                return;
            }

            tbody.innerHTML = filteredLogs.map((record) => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-4 whitespace-nowrap">${escapeHtml(formatThaiDate(record.date))}</td>
                    <td class="p-4 whitespace-nowrap">${escapeHtml(record.time || '-')}</td>
                    <td class="p-4 font-semibold">${escapeHtml(record.location || '-')}</td>
                    <td class="p-4">${escapeHtml(record.items || '-')}</td>
                    <td class="p-4">
                        <span class="px-3 py-1 rounded-full text-sm font-bold ${record.status === 'ไม่เรียบร้อย' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">
                            ${escapeHtml(record.status || '-')}
                        </span>
                        ${record.reason ? `<div class="text-xs text-red-500 mt-1">เหตุผล: ${escapeHtml(record.reason)}</div>` : ''}
                    </td>
                    <td class="p-4 text-gray-500">${escapeHtml(record.admin || '-')}</td>
                </tr>
            `).join('');
        }

        function formatThaiDate(dateString) {
            if (!dateString) return '-';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            return `${parts[2]}/${parts[1]}/${Number(parts[0]) + 543}`;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function setButtonLoading(button, loading, text) {
            button.disabled = loading;
            button.textContent = text;
        }

        function showDashboardMessage(message, isInfo) {
            const element = document.getElementById('dashboardMessage');
            element.textContent = message;
            element.className = `text-center p-4 mb-4 rounded-2xl ${isInfo ? 'bg-blue-50 text-blue-700' : 'bg-red-50 text-red-700'}`;
            element.classList.remove('hidden');
        }

        function hideDashboardMessage() {
            document.getElementById('dashboardMessage').classList.add('hidden');
        }

        window.addEventListener('beforeunload', stopDashboardPolling);
    </script>
</body>
</html>
