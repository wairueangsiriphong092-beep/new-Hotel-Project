<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โรงแรมแฮปปี้ไนท์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: url('https://github.com/wairueangsiriphong092-beep/new-Hotel-Project/blob/main/Gemini_Generated_Image_flnb93flnb93flnb.png?raw=true') no-repeat center center fixed;
            background-size: cover;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* Custom Checkbox Style */
        .item-card {
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid #e5e7eb;
        }
        .item-card:hover { border-color: #3b82f6; }
        .item-check:checked + .item-card {
            background-color: #eff6ff;
            border-color: #3b82f6;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div id="loginView" class="max-w-md mx-auto glass p-8 rounded-3xl shadow-2xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">โรงแรมแฮปปี้ไนท์</h1>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="Username" class="w-full p-4 border rounded-2xl bg-white shadow-inner focus:ring-2 focus:ring-blue-400 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 border rounded-2xl bg-white shadow-inner focus:ring-2 focus:ring-blue-400 outline-none">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 shadow-lg transition transform active:scale-95">เข้าสู่ระบบ</button>
        </div>
        <p id="loginError" class="text-red-500 text-center mt-4 hidden font-medium">Username หรือ Password ไม่ถูกต้อง</p>
    </div>

    <div id="appView" class="max-w-2xl mx-auto glass p-6 md:p-8 rounded-3xl shadow-2xl hidden">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">บันทึกข้อมูล</h2>
            <button onclick="toggleDashboard()" class="text-blue-600 font-semibold hover:underline transition">ดู Dashboard</button>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-lg font-semibold mb-3 text-gray-700">สถานที่</label>
                <select id="locationSelect" class="w-full p-4 border-2 border-gray-200 rounded-2xl bg-white focus:ring-4 focus:ring-blue-100 outline-none"></select>
            </div>
            
            <div>
                <label class="block text-lg font-semibold mb-4 text-gray-700">รายการที่ตรวจ</label>
                <div class="grid grid-cols-2 gap-3" id="itemChecklist">
                    <label class="relative">
                        <input type="checkbox" value="เตียง" class="item-check hidden">
                        <div class="item-card p-4 rounded-2xl text-center font-medium bg-white">เตียง</div>
                    </label>
                    <label class="relative">
                        <input type="checkbox" value="ห้องน้ำ" class="item-check hidden">
                        <div class="item-card p-4 rounded-2xl text-center font-medium bg-white">ห้องน้ำ</div>
                    </label>
                    <label class="relative">
                        <input type="checkbox" value="แอร์" class="item-check hidden">
                        <div class="item-card p-4 rounded-2xl text-center font-medium bg-white">แอร์</div>
                    </label>
                    <label class="relative">
                        <input type="checkbox" value="ฝักบัว" class="item-check hidden">
                        <div class="item-card p-4 rounded-2xl text-center font-medium bg-white">ฝักบัว</div>
                    </label>
                    <label class="col-span-2 mt-2 flex items-center justify-center space-x-3 p-4 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-300 cursor-pointer hover:bg-gray-100">
                        <input type="checkbox" id="checkAll" onclick="toggleAll()" class="w-5 h-5">
                        <span class="font-bold text-blue-700">ตรวจสอบแล้วทั้งหมด</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-lg font-semibold mb-3 text-gray-700">สถานะ</label>
                <select id="statusSelect" onchange="toggleReason()" class="w-full p-4 border-2 border-gray-200 rounded-2xl bg-white focus:ring-4 focus:ring-blue-100 outline-none">
                    <option value="เรียบร้อย">เรียบร้อย ✅</option>
                    <option value="ไม่เรียบร้อย">ไม่เรียบร้อย ⚠️</option>
                </select>
                <div id="reasonContainer" class="hidden mt-3 animate-in fade-in duration-300">
                    <input type="text" id="reasonInput" placeholder="ระบุสาเหตุที่ไม่เรียบร้อย..." class="w-full p-4 border-2 border-red-200 rounded-2xl bg-white focus:ring-4 focus:ring-red-100 outline-none">
                </div>
            </div>
            
            <button onclick="submitRecord()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold text-lg hover:bg-blue-700 shadow-xl transition transform active:scale-95">บันทึกข้อมูล</button>
            <div id="saveStatus" class="hidden text-center text-green-700 font-bold p-4 bg-green-50 rounded-2xl">บันทึกข้อมูลแล้ว! ✅</div>
        </div>
    </div>

    <div id="dashboardView" class="max-w-5xl mx-auto glass p-6 md:p-8 rounded-3xl shadow-2xl hidden mt-8">
        <h2 class="text-2xl font-bold mb-6">Dashboard</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="searchInput" oninput="renderDashboard()" placeholder="ค้นหาสถานที่..." class="p-4 border-2 rounded-2xl">
            <input type="date" id="filterDate" onchange="renderDashboard()" class="p-4 border-2 rounded-2xl">
            <select id="filterStatus" onchange="renderDashboard()" class="p-4 border-2 rounded-2xl">
                <option value="ทั้งหมด">สถานะทั้งหมด</option>
                <option value="เรียบร้อย">เรียบร้อย</option>
                <option value="ไม่เรียบร้อย">ไม่เรียบร้อย</option>
            </select>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b-2 border-gray-200">
                        <th class="p-4">เวลา</th><th class="p-4">สถานที่</th><th class="p-4">รายการ</th><th class="p-4">สถานะ</th><th class="p-4">ผู้ตรวจ</th>
                    </tr>
                </thead>
                <tbody id="dashboardTableBody"></tbody>
            </table>
        </div>
        <button onclick="toggleDashboard()" class="mt-8 text-gray-500 font-medium hover:text-gray-800 underline">ย้อนกลับ</button>
    </div>

    <script>
        const ADMINS = { "admin1": "pass1", "admin2": "pass2", "admin3": "pass3" };
        let currentAdmin = "";
        let logs = []; 

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(ADMINS[user] && ADMINS[user] === pass) {
                currentAdmin = user;
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('appView').classList.remove('hidden');
                initForm();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function initForm() {
            const select = document.getElementById('locationSelect');
            select.innerHTML = '<option value="">เลือกห้อง/บ้าน</option>';
            for(let i=1; i<=24; i++) select.innerHTML += `<option>ห้อง ${i}</option>`;
            for(let i=1; i<=3; i++) select.innerHTML += `<option>บ้าน ${i}</option>`;
        }

        function toggleAll() {
            const checked = document.getElementById('checkAll').checked;
            document.querySelectorAll('.item-check').forEach(i => i.checked = checked);
        }

        function toggleReason() {
            const status = document.getElementById('statusSelect').value;
            document.getElementById('reasonContainer').classList.toggle('hidden', status !== 'ไม่เรียบร้อย');
        }

        function submitRecord() {
            const location = document.getElementById('locationSelect').value;
            if(!location) return alert('โปรดเลือกสถานที่');
            
            const selectedItems = Array.from(document.querySelectorAll('.item-check:checked')).map(i => i.value);
            if(selectedItems.length === 0 && !document.getElementById('checkAll').checked) return alert('โปรดเลือกจุดที่ตรวจ');
            
            const record = {
                time: new Date().toLocaleTimeString('th-TH'),
                date: new Date().toISOString().split('T')[0],
                location: location,
                items: document.getElementById('checkAll').checked ? 'ทั้งหมด' : selectedItems.join(', '),
                status: document.getElementById('statusSelect').value,
                reason: document.getElementById('reasonInput').value,
                admin: currentAdmin
            };
            logs.push(record);
            
            const statusDiv = document.getElementById('saveStatus');
            statusDiv.classList.remove('hidden');
            setTimeout(() => statusDiv.classList.add('hidden'), 2000);
        }

        function toggleDashboard() {
            document.getElementById('appView').classList.toggle('hidden');
            document.getElementById('dashboardView').classList.toggle('hidden');
            if(!document.getElementById('dashboardView').classList.contains('hidden')) renderDashboard();
        }

        function renderDashboard() {
            const tbody = document.getElementById('dashboardTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const date = document.getElementById('filterDate').value;
            const status = document.getElementById('filterStatus').value;

            tbody.innerHTML = logs.filter(l => 
                (l.location.toLowerCase().includes(search)) &&
                (date === '' || l.date === date) &&
                (status === 'ทั้งหมด' || l.status === status)
            ).map(l => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-4">${l.time}</td>
                    <td class="p-4 font-semibold">${l.location}</td>
                    <td class="p-4">${l.items}</td>
                    <td class="p-4">
                        <span class="px-3 py-1 rounded-full text-sm font-bold ${l.status === 'ไม่เรียบร้อย' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">
                            ${l.status}
                        </span>
                        ${l.reason ? `<div class="text-xs text-red-400 mt-1 italic">เหตุผล: ${l.reason}</div>` : ''}
                    </td>
                    <td class="p-4 text-gray-500">${l.admin}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
